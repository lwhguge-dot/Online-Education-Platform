# CodeQL 自定义查询配置
#
# 设计说明：
# 本项目为前后端分离的微服务架构，采用「网关统一鉴权 + 无状态 JWT」模式。
# 以下规则经评估确认为误报或与项目威胁模型不符，故全局排除：
#
# - java/log-injection, js/log-injection：
#   日志注入。项目所有日志记录用户输入处均通过 sanitizeForLog() 净化（剥离控制字符并截断），
#   但 CodeQL 污点分析不识别自定义 sanitizer 函数，导致误报。
#
# - java/csrf-unprotected-request-type：
#   CSRF。项目为纯无状态 REST API（SessionCreationPolicy.STATELESS），
#   通过 Authorization: Bearer <jwt> 头部携带凭据，不使用 Cookie 会话，
#   无 Cookie 即无 CSRF 攻击面；网关侧另有限流与 HMAC 签名校验。
#
# - java/tainted-arithmetic：
#   污点算术。所有分页参数在 Service 层入口已做边界校验（safePage、safeSize、Math.max/min），
#   CodeQL 未能跨越方法边界识别净化，导致误报。

name: "Custom CodeQL Config"

queries:
  - uses: security-extended
  - uses: security-and-quality

paths:
  - backend
  - frontend/src

paths-ignore:
  - frontend/src/services/websocket.js

query-filters:
  - exclude:
      id: java/log-injection
  - exclude:
      id: js/log-injection
  - exclude:
      id: java/csrf-unprotected-request-type
  - exclude:
      id: java/tainted-arithmetic
