server:
  port: 8084

spring:
  application:
    name: progress-service
  threads:
    virtual:
      enabled: true  # 启用 Java 21 虚拟线程
  cloud:
    nacos:
      discovery:
        server-addr: "${NACOS_ADDR:nacos:8848}"
        username: "${NACOS_USERNAME:nacos}"
        password: "${NACOS_PASSWORD:nacos}"
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/edu_platform?characterEncoding=UTF-8}"
    username: "${SPRING_DATASOURCE_USERNAME:postgres}"
    password: "${SPRING_DATASOURCE_PASSWORD}"
    driver-class-name: org.postgresql.Driver
    hikari:
      # 虚拟线程优化配置
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:50}
      minimum-idle: ${HIKARI_MINIMUM_IDLE:10}
      connection-timeout: 30000  # 获取连接超时 30s
      idle-timeout: 600000       # 空闲连接存活 10 分钟
      max-lifetime: 1800000      # 连接最大生命周期 30 分钟
      leak-detection-threshold: 60000  # 连接泄漏检测 60s
      connection-test-query: SELECT 1  # PostgreSQL 连接测试
  # Redis 配置
  data:
    redis:
      host: "${SPRING_REDIS_HOST:redis}"
      port: 6379
      password: "${SPRING_REDIS_PASSWORD}"
      database: 4
      timeout: 10s
      lettuce:
        pool:
          max-active: 32
          max-wait: 5s
          max-idle: 16
          min-idle: 4

# Redisson 配置（用于分布式锁）
redisson:
  single-server-config:
    address: "redis://${SPRING_REDIS_HOST:redis}:${SPRING_REDIS_PORT:6379}"
    password: "${SPRING_REDIS_PASSWORD}"
    database: 4

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Actuator 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

security:
  # 内部高危接口令牌（用于 /cascade/* 服务间鉴权）
  internal-token: "${INTERNAL_API_TOKEN}"

# 进度上报配置
edu:
  progress-tracking:
    fast-forward-tolerance-ratio: 1.5   # 异常快进判定的时间倍率（上报增量 > 实际耗时 * 此倍率 + 容错秒数 即视为作弊）
    fast-forward-tolerance-seconds: 5   # 异常快进判定的容错秒数
    db-sync-interval-ms: 30000          # 进度落库最小时间间隔（毫秒），间隔内仅写 Redis
