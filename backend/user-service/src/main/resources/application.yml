server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: user-service
  threads:
    virtual:
      enabled: true  # 启用 Java 21 虚拟线程
  cloud:
    nacos:
      discovery:
        server-addr: "${NACOS_ADDR:nacos:8848}"
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/edu_platform?characterEncoding=UTF-8}"
    username: "${SPRING_DATASOURCE_USERNAME:postgres}"
    password: "${SPRING_DATASOURCE_PASSWORD}"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50  # 虚拟线程优化：增加连接池大小
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Redis 配置
  data:
    redis:
      host: "${SPRING_REDIS_HOST:redis}"
      port: 6379  # Redis 端口
      password: "${SPRING_REDIS_PASSWORD}"
      database: 0  # 使用 0 号数据库
      timeout: 10s
      lettuce:
        pool:
          max-active: 32
          max-wait: 5s
          max-idle: 16
          min-idle: 4

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

minio:
  endpoint: http://minio:9000
  access-key: "${MINIO_ACCESS_KEY}"
  secret-key: "${MINIO_SECRET_KEY}"
  bucket: edu-platform

jwt:
  secret: "${JWT_SECRET}"
  expiration: 604800000

session:
  timeout-seconds: 604800  # 7天，与 JWT 过期时间保持一致

websocket:
  # 支持多个来源，使用逗号分隔；生产环境请改为实际域名
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173}

bootstrap:
  admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}

# Actuator 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

security:
  # 服务间内部调用令牌（用于调用级联删除接口）
  internal-token: "${INTERNAL_API_TOKEN}"
  password-reset:
    # 限流窗口（秒）
    window-seconds: ${PASSWORD_RESET_WINDOW_SECONDS:600}
    # 同一来源 IP 在窗口期内最多申请次数
    request-limit-per-ip: ${PASSWORD_RESET_REQUEST_LIMIT_PER_IP:10}
    # 同一身份（邮箱+姓名）在窗口期内最多申请次数
    request-limit-per-identity: ${PASSWORD_RESET_REQUEST_LIMIT_PER_IDENTITY:5}
    # 同一来源 IP 在窗口期内最多确认次数
    confirm-limit-per-ip: ${PASSWORD_RESET_CONFIRM_LIMIT_PER_IP:10}
    # 重置令牌有效期（秒）
    token-ttl-seconds: ${PASSWORD_RESET_TOKEN_TTL_SECONDS:900}
