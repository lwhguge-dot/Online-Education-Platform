server:
  port: 8082

spring:
  application:
    name: course-service
  threads:
    virtual:
      enabled: true  # 启用 Java 21 虚拟线程
  cloud:
    nacos:
      discovery:
        server-addr: "${NACOS_ADDR:nacos:8848}"
        username: "${NACOS_USERNAME:nacos}"
        password: "${NACOS_PASSWORD:nacos}"
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/edu_platform?characterEncoding=UTF-8}"
    username: "${SPRING_DATASOURCE_USERNAME:postgres}"
    password: "${SPRING_DATASOURCE_PASSWORD}"
    driver-class-name: org.postgresql.Driver
    hikari:
      # 虚拟线程优化配置
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:50}
      minimum-idle: ${HIKARI_MINIMUM_IDLE:10}
      connection-timeout: 30000  # 获取连接超时 30s
      idle-timeout: 600000       # 空闲连接存活 10 分钟
      max-lifetime: 1800000      # 连接最大生命周期 30 分钟
      leak-detection-threshold: 60000  # 连接泄漏检测 60s
      connection-test-query: SELECT 1  # PostgreSQL 连接测试

  # Redis 配置
  data:
    redis:
      host: "${SPRING_REDIS_HOST:redis}"
      port: 6379  # Redis 端口
      password: "${SPRING_REDIS_PASSWORD}"
      database: 2  # 课程服务 - 使用 2 号数据库
      timeout: 10s
      lettuce:
        pool:
          max-active: 32
          max-wait: 5s
          max-idle: 16
          min-idle: 4

# Redisson 配置（用于分布式锁）
redisson:
  single-server-config:
    address: "redis://${SPRING_REDIS_HOST:redis}:${SPRING_REDIS_PORT:6379}"
    password: "${SPRING_REDIS_PASSWORD}"
    database: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

file:
  max-size: 629145600

minio:
  endpoint: http://minio:9000
  access-key: "${MINIO_ACCESS_KEY}"
  secret-key: "${MINIO_SECRET_KEY}"
  bucket: edu-platform

spring.servlet.multipart:
  max-file-size: 600MB
  max-request-size: 600MB

# Actuator 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

security:
  # 内部高危接口令牌（用于 /cascade/* 服务间鉴权）
  internal-token: "${INTERNAL_API_TOKEN}"

# 学情评估配置
edu:
  learning-status:
    inactive-days: 7              # 静默期阈值（天）：超过此天数未学习标记为 inactive
    excellent-threshold: 80       # 优秀阈值：综合得分 >= 此值为 excellent
    good-threshold: 50            # 良好阈值：综合得分 >= 此值为 good
    at-risk-threshold: 30         # 风险阈值：综合得分 < 此值为 at-risk
    activity-weight: 0.3          # 活跃度权重（30%）
    progress-weight: 0.4          # 学习进度权重（40%）
    quiz-weight: 0.3              # 测验成绩权重（30%）
    default-quiz-score: 60        # 默认测验成绩（暂无数据时使用）
    activity-decay-per-day: 10    # 活跃度每日衰减值（分/天）
  chapter-defaults:
    unlock-video-rate: 0.9        # 默认视频完成率阈值（学生观看达到此比例视为通过）
    unlock-quiz-score: 60         # 默认测验及格分数
    default-status: 1             # 章节默认启用状态（1=启用，0=禁用）
    default-quiz-score: 10        # 章节测验题默认分值
