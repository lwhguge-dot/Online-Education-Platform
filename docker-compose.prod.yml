# =============================================================================
# 生产环境 Docker Compose 配置
#
# 用法: docker compose -f docker-compose.prod.yml up -d
# 注意: 此文件移除了开发专用服务（hindsight、ollama-json-proxy），
#       内部服务端口不再映射到宿主机，仅暴露 gateway(8090) 和 frontend(5173)。
# =============================================================================

services:
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: prod-nacos
    environment:
      - MODE=standalone
      - JVM_XMS=256m
      - JVM_XMX=256m
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:?NACOS_AUTH_TOKEN is required}
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=security
      - NACOS_AUTH_SERVER_IDENTITY_KEY=edu-platform-nacos
      - NACOS_AUTH_SERVER_IDENTITY_VALUE=${NACOS_AUTH_TOKEN}
    # 生产环境不暴露端口，仅内部网络访问
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8848/nacos/v1/console/health/readiness || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - edu-net
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: prod-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=edu_platform
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    # 生产环境不暴露端口，仅内部网络访问
    volumes:
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    command: postgres -c shared_buffers=256MB -c effective_cache_size=768MB -c wal_buffers=16MB -c max_connections=100 -c random_page_cost=1.1
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - edu-net
    restart: unless-stopped

  redis:
    image: redis:7.0
    container_name: prod-redis
    # 生产环境不暴露端口，仅内部网络访问
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10
    volumes:
      - redis-data:/data
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli --no-auth-warning -a \"$REDIS_PASSWORD\" ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - edu-net
    restart: unless-stopped

  gateway:
    image: demo-gateway:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_NAME: gateway
    container_name: prod-gateway
    ports:
      - "8090:8090"
    environment:
      - NACOS_ADDR=nacos:8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:+UseStringDeduplication
      - SPRING_THREADS_VIRTUAL_ENABLED=false
      - SPRING_CLOUD_LOADBALANCER_CACHE_ENABLED=true
      - SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS-CONFIGURATIONS_[/**]_ALLOWED-ORIGINS=${ALLOWED_ORIGINS:-http://localhost}
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      nacos:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8090/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - edu-net
    restart: unless-stopped

  user-service:
    image: demo-user-service:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_NAME: user-service
    container_name: prod-user-service
    environment:
      - NACOS_ADDR=nacos:8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/edu_platform?characterEncoding=UTF-8
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:+UseStringDeduplication
      - SESSION_TIMEOUT_SECONDS=604800
      - SPRING_CLOUD_LOADBALANCER_CACHE_ENABLED=true
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - edu-net
    restart: unless-stopped

  course-service:
    image: demo-course-service:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_NAME: course-service
    container_name: prod-course-service
    environment:
      - NACOS_ADDR=nacos:8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/edu_platform?characterEncoding=UTF-8
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:+UseStringDeduplication
      - SPRING_CLOUD_LOADBALANCER_CACHE_ENABLED=true
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8082/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - edu-net
    restart: unless-stopped

  homework-service:
    image: demo-homework-service:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_NAME: homework-service
    container_name: prod-homework-service
    environment:
      - NACOS_ADDR=nacos:8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/edu_platform?characterEncoding=UTF-8
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:+UseStringDeduplication
      - SPRING_CLOUD_LOADBALANCER_CACHE_ENABLED=true
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8083/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - edu-net
    restart: unless-stopped

  progress-service:
    image: demo-progress-service:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_NAME: progress-service
    container_name: prod-progress-service
    environment:
      - NACOS_ADDR=nacos:8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/edu_platform?characterEncoding=UTF-8
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:+UseStringDeduplication
      - SPRING_CLOUD_LOADBALANCER_CACHE_ENABLED=true
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8084/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - edu-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prod-frontend
    ports:
      - "5173:80"
    mem_limit: 256m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:80 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - edu-net
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: prod-minio
    # 生产环境不暴露端口，仅内部网络访问
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edu-net
    restart: unless-stopped

networks:
  edu-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  nacos-data:
  minio-data:
