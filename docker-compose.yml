services:
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: demo-nacos
    environment:
      - MODE=standalone
      - JVM_XMS=256m
      - JVM_XMX=256m
      # 开发环境禁用Nacos认证
      - NACOS_AUTH_ENABLE=false
    ports:
      # SEC-05: 绑定 127.0.0.1，仅本机可访问
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8848/nacos/v1/console/health/readiness || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - edu-net
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  postgres:
    image: postgres:16
    container_name: demo-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=edu_platform
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    ports:
      # SEC-05: 绑定 127.0.0.1，仅本机可访问
      - "127.0.0.1:5432:5432"
    volumes:
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    command: postgres -c shared_buffers=256MB -c effective_cache_size=768MB -c wal_buffers=16MB -c max_connections=100 -c random_page_cost=1.1
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edu-net
    restart: always

  redis:
    image: redis:7.0
    container_name: demo-redis
    ports:
      # SEC-05: 绑定 127.0.0.1，仅本机可访问
      - "127.0.0.1:16379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10
    volumes:
      - redis-data:/data
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      # DOCK-03: 使用 --no-auth-warning 避免密码出现在 docker inspect 输出中
      test: [ "CMD-SHELL", "redis-cli --no-auth-warning -a \"$REDIS_PASSWORD\" ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edu-net
    restart: always

  gateway:
    image: demo-gateway:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_NAME: gateway
    container_name: demo-gateway
    ports:
      - "8090:8090"
    environment:
      - NACOS_ADDR=nacos:8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:+UseStringDeduplication
      - SPRING_THREADS_VIRTUAL_ENABLED=false
      - SPRING_CLOUD_LOADBALANCER_CACHE_ENABLED=true
      - SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS-CONFIGURATIONS_[/**]_ALLOWED-ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      nacos:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8090/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - edu-net
    restart: always

  user-service:
    image: demo-user-service:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_NAME: user-service
    container_name: demo-user-service
    environment:
      - NACOS_ADDR=nacos:8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/edu_platform?characterEncoding=UTF-8
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:+UseStringDeduplication
      - SESSION_TIMEOUT_SECONDS=604800
      - SPRING_CLOUD_LOADBALANCER_CACHE_ENABLED=true
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - edu-net
    restart: always

  course-service:
    image: demo-course-service:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_NAME: course-service
    container_name: demo-course-service
    environment:
      - NACOS_ADDR=nacos:8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/edu_platform?characterEncoding=UTF-8
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:+UseStringDeduplication
      - SPRING_CLOUD_LOADBALANCER_CACHE_ENABLED=true
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8082/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - edu-net
    restart: always

  homework-service:
    image: demo-homework-service:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_NAME: homework-service
    container_name: demo-homework-service
    environment:
      - NACOS_ADDR=nacos:8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/edu_platform?characterEncoding=UTF-8
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:+UseStringDeduplication
      - SPRING_CLOUD_LOADBALANCER_CACHE_ENABLED=true
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8083/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - edu-net
    restart: always

  progress-service:
    image: demo-progress-service:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_NAME: progress-service
    container_name: demo-progress-service
    # DOCK-04: 移除端口映射，统一通过 Gateway（8090）路由访问
    environment:
      - NACOS_ADDR=nacos:8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/edu_platform?characterEncoding=UTF-8
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:+UseStringDeduplication
      - SPRING_CLOUD_LOADBALANCER_CACHE_ENABLED=true
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8084/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - edu-net
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: demo-frontend
    ports:
      - "5173:80"
    mem_limit: 256m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:80 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - edu-net
    restart: always

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: demo-minio
    ports:
      # SEC-05: 绑定 127.0.0.1，仅本机可访问
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edu-net
    restart: always

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: demo-hindsight
    ports:
      # SEC-05: 绑定 127.0.0.1，仅本机可访问
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9999:9999"
    environment:
      - HINDSIGHT_API_LLM_PROVIDER=ollama
      - HINDSIGHT_API_LLM_API_KEY=ollama
      - HINDSIGHT_API_LLM_MODEL=qwen2.5:3b
      - HINDSIGHT_API_LLM_BASE_URL=http://ollama-json-proxy:11435/v1
      - OLLAMA_KEEP_ALIVE=-1
      - HINDSIGHT_API_LLM_MAX_CONCURRENT=1
      - HINDSIGHT_API_LLM_TEMPERATURE=0
      - HINDSIGHT_API_LOG_LEVEL=info
      - HF_ENDPOINT=https://huggingface.co
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HINDSIGHT_API_EMBEDDINGS_PROVIDER=local
      - HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL=BAAI/bge-m3
      - HINDSIGHT_API_RERANKER_PROVIDER=rrf
      - HINDSIGHT_API_WORKER_ID=hindsight-worker-1
    volumes:
      - hindsight-data:/home/hindsight/.pg0
      - hindsight-cache:/home/hindsight/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    mem_limit: 2g
    memswap_limit: 3g
    cpus: 2.0
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edu-net
    restart: always

  ollama-json-proxy:
    image: python:3.12-slim
    container_name: demo-ollama-json-proxy
    command: python /app/json-ollama-proxy.py
    volumes:
      - ./ops/scripts/hindsight/json-ollama-proxy.py:/app/json-ollama-proxy.py
    environment:
      - OLLAMA_HOST=host.docker.internal
      - OLLAMA_PORT=11434
      - PROXY_PORT=11435
      - LLM_TIMEOUT=300
    ports:
      # SEC-05: 绑定 127.0.0.1，仅本机可访问
      - "127.0.0.1:11436:11435"
    networks:
      - edu-net
    restart: unless-stopped

networks:
  edu-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  nacos-data:
  minio-data:
  hindsight-data:
  hindsight-cache:
